name: Bug report
description: Report a reproducible problem with Cornerstone Unbound
title: "[Bug]: "
labels:
  - "type: bug"
  - "status: needs triage"
body:
  - type: input
    id: pack_version
    attributes:
      label: Cornerstone Unbound version
    validations:
      required: true
  - type: input
    id: minecraft
    attributes:
      label: Minecraft version
      placeholder: "1.12.2"
    validations:
      required: true
  - type: input
    id: launcher
    attributes:
      label: Launcher
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Single-player / integrated server
        - Dedicated server
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the problem clearly.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or crash report
      description: Attach or link the relevant latest.log, crash report, or other useful log. Please do not paste extremely long logs directly into the issue body.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add screenshots, affected mods, configuration details, or anything else that may help reproduce the problem.
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I checked existing issues for the same problem.
          required: true
